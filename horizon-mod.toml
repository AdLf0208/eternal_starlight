id = "eternal_starlight"
name = "Eternal Starlight"
version = "0.2.0"
description = """A port of Eternal Starlight for Horizon, slice 1: the Starlight dimension exists,
is enterable and generates. The dimension is registered over the mod's own noise settings and
parameters, with its own surface material rule and four of its biomes (starlight forest, dense
forest, glimmer scrubland, dark swamp) and the blocks those surfaces use. Its other nineteen
biomes, its structures, its plants and ores, its mobs and its client effects are recorded gaps."""
authors = ["LeoMinecraftModding", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: an integrated server belongs to the client
# installation, so a LAN host or a single-player world needs both. A dedicated server is "server".
side = "both"
# "May add blocks, items, mob effects and entity types to your worlds": this port declares blocks.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
